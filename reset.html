<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Обновление Nomeraa</title>
<style>
html,body{margin:0;min-height:100%;background:#07090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:24px}
.card{max-width:420px;text-align:center;background:#10161e;border:1px solid #ffffff12;border-radius:22px;padding:24px;box-shadow:0 25px 80px #0009}
.logo{width:72px;height:72px;border-radius:20px;margin:0 auto 16px;background:linear-gradient(145deg,#fff,#ced7de);display:grid;place-items:center;color:#111;font-size:28px;font-weight:950}
h1{font-size:24px;margin:0 0 8px}p{color:#8d9ba8;font-size:13px;line-height:1.5}
button{border:0;border-radius:13px;padding:13px 16px;background:#2388d7;color:#fff;font-weight:900;width:100%;font-size:14px}
#status{margin-top:12px;color:#75cc97;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">77</div>
  <h1>Обновление Nomeraa</h1>
  <p>Эта страница удалит только кэш сайта и старые Service Worker. Игровой прогресс в localStorage сохраняется.</p>
  <button id="go">Очистить кэш и открыть V6.2</button>
  <div id="status"></div>
</div>
<script>
document.getElementById('go').onclick=async()=>{
  const s=document.getElementById('status');s.textContent='Обновление…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    s.textContent='Готово. Открываю новую версию…';
  }catch(e){s.textContent='Кэш очищен частично. Открываю новую версию…'}
  setTimeout(()=>location.replace('./?app=6.2&t='+Date.now()),500);
};
</script>
</body>
</html>
